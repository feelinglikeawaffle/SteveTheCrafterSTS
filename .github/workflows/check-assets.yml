name: Check Steve art assets

on:
  push:
    paths:
      - "src/main/resources/stevethecrafter/images/**"
      - "scripts/check_assets.py"
      - ".github/workflows/check-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate imported art paths and dimensions
        run: python scripts/check_assets.py
