plugins {
    id 'java'
}

group = 'stevethecrafter'
version = '0.1.0'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenCentral()
}

// Put your locally installed game/mod framework jars in ./lib (not committed).
// Exact jar filenames can vary by installation; adjust these entries if needed.
dependencies {
    compileOnly files('lib/desktop-1.0.jar')
    compileOnly files('lib/ModTheSpire.jar')
    compileOnly files('lib/BaseMod.jar')
}

jar {
    archiveBaseName = 'SteveTheCrafterSTS'
}


// Prepare correctly proportioned card portraits from the imported pixel-art icons.
// The source icons stay untouched; generated 250x190 hand art and 500x380 inspect
// art are written into Gradle's resources output before the JAR is assembled.
def steveCardArt = [
    [name: 'wooden_sword', source: 'images/relics/diamond_sword.png'],
    [name: 'wooden_pickaxe', source: 'images/relics/iron_pickaxe.png'],
    [name: 'wooden_shield', source: 'images/relics/shield.png'],
    [name: 'mine_coal', source: 'images/materials/coal.png'],
    [name: 'make_torch', source: 'images/relics/redstone_torch.png'],
    [name: 'stone_sword', source: 'images/materials/stone.png'],
    [name: 'mine_copper', source: 'images/materials/copper.png'],
    [name: 'mine_redstone', source: 'images/materials/redstone.png'],
    [name: 'tnt', source: 'images/rooms/nether_portal.png'],
    [name: 'lapis_enchant', source: 'images/relics/enchanted_book.png'],
    [name: 'iron_axe', source: 'images/relics/diamond_sword.png'],
    [name: 'cobblestone_guard', source: 'images/relics/shield.png'],
    [name: 'smelt_ore', source: 'images/materials/iron.png'],
    [name: 'forge_strike', source: 'images/relics/nether_star.png'],
    [name: 'redstone_pulse', source: 'images/materials/redstone.png'],
    [name: 'tnt_crate', source: 'images/rooms/nether_portal.png'],
    [name: 'diamond_edge', source: 'images/materials/diamond.png'],
    [name: 'enchanted_armor', source: 'images/relics/enchanted_book.png'],
    [name: 'golden_apple', source: 'images/relics/golden_apple.png'],
    [name: 'emerald_trade', source: 'images/materials/emerald.png'],
    [name: 'lapis_focus', source: 'images/materials/lapis.png'],
    [name: 'netherite_hammer', source: 'images/materials/ancient_debris.png']
]

tasks.register('prepareSteveCardArt') {
    dependsOn tasks.named('processResources')
    inputs.files(steveCardArt.collect { file("src/main/resources/stevethecrafter/" + it.source) })
    outputs.files(steveCardArt.collectMany { art ->
        [
            file("$buildDir/resources/main/stevethecrafter/images/cards/" + art.name + ".png"),
            file("$buildDir/resources/main/stevethecrafter/images/cards/" + art.name + "_p.png")
        ]
    })
    doLast {
        def outputDir = file("$buildDir/resources/main/stevethecrafter/images/cards")
        outputDir.mkdirs()

        def renderPixelArt = { File sourceFile, File outputFile, int width, int height ->
            java.awt.image.BufferedImage sourceImage = javax.imageio.ImageIO.read(sourceFile)
            if (sourceImage == null) {
                throw new GradleException("Could not read card art PNG: " + sourceFile)
            }

            java.awt.image.BufferedImage result = new java.awt.image.BufferedImage(width, height, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            java.awt.Graphics2D graphics = result.createGraphics()
            try {
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                        java.awt.RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR)
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING,
                        java.awt.RenderingHints.VALUE_ANTIALIAS_OFF)
                double scale = Math.min(width / (double) sourceImage.width,
                        height / (double) sourceImage.height)
                int drawWidth = Math.max(1, (int) Math.round(sourceImage.width * scale))
                int drawHeight = Math.max(1, (int) Math.round(sourceImage.height * scale))
                int x = (width - drawWidth) / 2
                int y = (height - drawHeight) / 2
                graphics.drawImage(sourceImage, x, y, drawWidth, drawHeight, null)
            } finally {
                graphics.dispose()
            }
            javax.imageio.ImageIO.write(result, 'png', outputFile)
        }

        steveCardArt.each { art ->
            File sourceFile = file("src/main/resources/stevethecrafter/" + art.source)
            renderPixelArt(sourceFile, new File(outputDir, art.name + ".png"), 250, 190)
            renderPixelArt(sourceFile, new File(outputDir, art.name + "_p.png"), 500, 380)
            println("Prepared Steve card art: " + art.name + " (250x190, 500x380)")
        }
    }
}


// Bundle real game card-frame/orb source textures under the mod namespace, then
// shift their blue accents toward Steve's teal. This gives Steve a separate
// LibraryType/card pool without relying on missing runtime texture paths.
tasks.register('prepareSteveCardColorTextures') {
    dependsOn tasks.named('processResources')
    inputs.file(file('lib/desktop-1.0.jar'))
    outputs.dir(file("$buildDir/resources/main/stevethecrafter/images/cardui"))
    doLast {
        File gameJar = file('lib/desktop-1.0.jar')
        if (!gameJar.isFile()) {
            throw new GradleException("Missing lib/desktop-1.0.jar. Run build-mod.bat so the build script can locate your game files.")
        }

        def texturePaths = [
            'images/512/cardui/card_bg_attack.png',
            'images/512/cardui/card_bg_skill.png',
            'images/512/cardui/card_bg_power.png',
            'images/512/cardui/card_orb.png',
            'images/512/cardui/card_small_orb.png',
            'images/1024/cardui/card_bg_attack.png',
            'images/1024/cardui/card_bg_skill.png',
            'images/1024/cardui/card_bg_power.png',
            'images/1024/cardui/card_orb.png'
        ]

        java.util.zip.ZipFile zip = new java.util.zip.ZipFile(gameJar)
        try {
            texturePaths.each { relative ->
                def entry = zip.getEntry(relative)
                if (entry == null) {
                    throw new GradleException("Could not find " + relative + " inside lib/desktop-1.0.jar; cannot safely build Steve's custom card colour.")
                }

                File output = file("$buildDir/resources/main/stevethecrafter/" + relative)
                output.parentFile.mkdirs()
                zip.getInputStream(entry).withCloseable { input ->
                    output.withOutputStream { out ->
                        byte[] buffer = new byte[8192]
                        int count
                        while ((count = input.read(buffer)) >= 0) {
                            out.write(buffer, 0, count)
                        }
                    }
                }

                java.awt.image.BufferedImage source = javax.imageio.ImageIO.read(output)
                if (source == null) {
                    throw new GradleException("Invalid card texture PNG: " + relative)
                }
                java.awt.image.BufferedImage tinted = new java.awt.image.BufferedImage(
                        source.width, source.height, java.awt.image.BufferedImage.TYPE_INT_ARGB)
                for (int y = 0; y < source.height; y++) {
                    for (int x = 0; x < source.width; x++) {
                        int argb = source.getRGB(x, y)
                        int alpha = (argb >>> 24) & 0xff
                        if (alpha == 0) {
                            tinted.setRGB(x, y, argb)
                            continue
                        }
                        int red = (argb >>> 16) & 0xff
                        int green = (argb >>> 8) & 0xff
                        int blue = argb & 0xff
                        float[] hsb = java.awt.Color.RGBtoHSB(red, green, blue, null)
                        // Only shift blue/cyan saturated pixels; preserve neutral parchment and shadows.
                        if (hsb[1] > 0.18F && hsb[0] >= 0.48F && hsb[0] <= 0.78F) {
                            hsb[0] = 0.47F
                            hsb[1] = Math.min(1.0F, hsb[1] * 1.12F)
                            int rgb = java.awt.Color.HSBtoRGB(hsb[0], hsb[1], hsb[2])
                            tinted.setRGB(x, y, (alpha << 24) | (rgb & 0x00ffffff))
                        } else {
                            tinted.setRGB(x, y, argb)
                        }
                    }
                }
                javax.imageio.ImageIO.write(tinted, 'png', output)
                println("Prepared Steve teal card texture: " + relative)
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('jar') {
    dependsOn tasks.named('prepareSteveCardArt')
    dependsOn tasks.named('prepareSteveCardColorTextures')
}
