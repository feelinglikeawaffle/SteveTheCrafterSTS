plugins {
    id 'java'
}

group = 'stevethecrafter'
version = '0.1.0'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenCentral()
}

// Put your locally installed game/mod framework jars in ./lib (not committed).
// Exact jar filenames can vary by installation; adjust these entries if needed.
dependencies {
    compileOnly files('lib/desktop-1.0.jar')
    compileOnly files('lib/ModTheSpire.jar')
    compileOnly files('lib/BaseMod.jar')
}

jar {
    archiveBaseName = 'SteveTheCrafterSTS'
}


// Prepare correctly proportioned card portraits from the imported pixel-art icons.
// The source icons stay untouched; generated 250x190 hand art and 500x380 inspect
// art are written into Gradle's resources output before the JAR is assembled.
import java.awt.Graphics2D
import java.awt.RenderingHints
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

def steveCardArt = [
    [name: 'wooden_sword', source: 'images/relics/diamond_sword.png'],
    [name: 'wooden_pickaxe', source: 'images/relics/iron_pickaxe.png'],
    [name: 'wooden_shield', source: 'images/relics/shield.png'],
    [name: 'mine_coal', source: 'images/materials/coal.png'],
    [name: 'make_torch', source: 'images/relics/redstone_torch.png'],
    [name: 'stone_sword', source: 'images/materials/stone.png'],
    [name: 'mine_copper', source: 'images/materials/copper.png'],
    [name: 'mine_redstone', source: 'images/materials/redstone.png'],
    [name: 'tnt', source: 'images/rooms/nether_portal.png'],
    [name: 'lapis_enchant', source: 'images/relics/enchanted_book.png']
]

tasks.register('prepareSteveCardArt') {
    dependsOn tasks.named('processResources')
    inputs.files(steveCardArt.collect { file("src/main/resources/stevethecrafter/" + it.source) })
    outputs.files(steveCardArt.collectMany { art ->
        [
            file("$buildDir/resources/main/stevethecrafter/images/cards/" + art.name + ".png"),
            file("$buildDir/resources/main/stevethecrafter/images/cards/" + art.name + "_p.png")
        ]
    })
    doLast {
        def outputDir = file("$buildDir/resources/main/stevethecrafter/images/cards")
        outputDir.mkdirs()

        def renderPixelArt = { File sourceFile, File outputFile, int width, int height ->
            BufferedImage sourceImage = ImageIO.read(sourceFile)
            if (sourceImage == null) {
                throw new GradleException("Could not read card art PNG: " + sourceFile)
            }

            BufferedImage result = new BufferedImage(width, height, BufferedImage.TYPE_INT_ARGB)
            Graphics2D graphics = result.createGraphics()
            try {
                graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION,
                        RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR)
                graphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING,
                        RenderingHints.VALUE_ANTIALIAS_OFF)
                double scale = Math.min(width / (double) sourceImage.width,
                        height / (double) sourceImage.height)
                int drawWidth = Math.max(1, (int) Math.round(sourceImage.width * scale))
                int drawHeight = Math.max(1, (int) Math.round(sourceImage.height * scale))
                int x = (width - drawWidth) / 2
                int y = (height - drawHeight) / 2
                graphics.drawImage(sourceImage, x, y, drawWidth, drawHeight, null)
            } finally {
                graphics.dispose()
            }
            ImageIO.write(result, 'png', outputFile)
        }

        steveCardArt.each { art ->
            File sourceFile = file("src/main/resources/stevethecrafter/" + art.source)
            renderPixelArt(sourceFile, new File(outputDir, art.name + ".png"), 250, 190)
            renderPixelArt(sourceFile, new File(outputDir, art.name + "_p.png"), 500, 380)
            println("Prepared Steve card art: " + art.name + " (250x190, 500x380)")
        }
    }
}

tasks.named('jar') {
    dependsOn tasks.named('prepareSteveCardArt')
}
